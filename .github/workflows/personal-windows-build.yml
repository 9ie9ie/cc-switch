name: Personal Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/reasoning-token-v4.0.12

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend verification
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript type check
        run: pnpm typecheck
      - name: Frontend unit tests
        run: pnpm test:unit --testTimeout=15000 --maxWorkers=4 --minWorkers=1

  windows-x64:
    name: Windows x64 unsigned build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri -> target
            codex-bridge -> target

      - name: Create frontend dist placeholder
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Codex bridge format check
        working-directory: codex-bridge
        run: cargo fmt -- --check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0
        with:
          tool: cargo-nextest

      - name: Rust tests
        working-directory: src-tauri
        run: cargo nextest run --profile ci

      - name: Codex bridge tests
        working-directory: codex-bridge
        run: cargo test

      - name: Build Codex sidebar usage bridge
        working-directory: codex-bridge
        run: cargo build --release

      - name: Build unsigned NSIS bundle
        run: pnpm tauri build --bundles nsis --config .github/tauri.personal.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-v4.0.12-windows-x64-reasoning-token
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/cc-switch.exe
            codex-bridge/target/release/cc-switch-codex-bridge.exe
          if-no-files-found: error
