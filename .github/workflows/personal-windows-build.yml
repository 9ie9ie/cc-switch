name: Personal Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/reasoning-token-display-v3.16.5

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 unsigned build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:unit -- tests/components/RequestLogTable.test.tsx

      - name: Rust tests
        working-directory: src-tauri
        run: |
          cargo test reasoning
          cargo test model_pricing

      - name: Build unsigned NSIS bundle
        run: pnpm tauri build --bundles nsis --config .github/tauri.personal.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-x64-v3.16.5-reasoning-token
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/cc-switch.exe
          if-no-files-found: error
