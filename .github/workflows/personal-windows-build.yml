name: Personal Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - codex/reasoning-token-v3.17

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 unsigned build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm exec vitest run tests/components/RequestLogTable.test.tsx

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust tests
        working-directory: src-tauri
        run: |
          cargo test reasoning
          cargo test dedup
          cargo test get_sync_state_only_treats_missing_rows_as_unsynced
          cargo test sync_import_preserves_local_only_tables
          cargo test custom_v12_database_upgrades_to_complete_upstream_v13
          cargo test test_log_request
          cargo test test_rollup_normalizes_total_cache_semantics_to_fresh

      - name: Build unsigned NSIS bundle
        run: pnpm tauri build --bundles nsis --config .github/tauri.personal.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-x64-reasoning-token
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/cc-switch.exe
          if-no-files-found: error
